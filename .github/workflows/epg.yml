name: Build EPG

on:
  schedule:
    - cron: "17 4 * * *"   # daily, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epg
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build guide
        run: python build_epg.py --region europe --cache "$RUNNER_TEMP/cache" --out out

      - name: Publish guide as a release asset (overwritten each day, no git history bloat)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view epg >/dev/null 2>&1 || gh release create epg \
            --title "Daily EPG" --notes "Rolling guide, rebuilt daily by .github/workflows/epg.yml. Do not rely on a specific version."
          gh release upload epg out/guide.xml.gz --clobber

      - name: Commit playlist + coverage if changed
        run: |
          cp out/playlist.m3u playlist-europe.m3u
          cp out/coverage.md COVERAGE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist-europe.m3u COVERAGE.md
          git diff --cached --quiet || git commit -m "Update EPG mapping and coverage"
          git push
